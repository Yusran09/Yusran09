<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PMIS Dashboard</title>
<style>
  /* ---------------------------------------------------------------
     PMIS DASHBOARD PORTAL
     Embeds a Power BI report through its "secure embed" link.
     Viewers sign in with their organisational account; access is
     governed by the Power BI workspace / app permissions.
     --------------------------------------------------------------- */
  :root{
    --ink:#1C3A5E; --navy:#243761; --slate:#56698F; --text:#6B7785;
    --muted:#8A9099; --line:#E6EBF1; --soft:#F6F8FB; --bg:#EEF1F5;
    --good:#0F9B80; --warn:#E39016;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column}

  /* top bar */
  .bar{display:flex;align-items:center;gap:14px;height:60px;padding:0 20px;background:#FFFFFF;border-bottom:1px solid var(--line)}
  .tile{width:34px;height:34px;border-radius:9px;background:var(--navy);color:#FFF;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(36,55,97,.22);flex-shrink:0}
  .tile svg{width:18px;height:18px}
  .eb{font-size:9px;font-weight:700;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
  .tt{margin-top:2px;font-size:18px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
  .sp{flex:1}
  .st{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
  .st i{width:7px;height:7px;border-radius:50%;background:var(--warn)}
  .st.ok i{background:var(--good)}
  .btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:#FFF;color:var(--ink);font:600 12px 'Segoe UI',Arial,sans-serif;cursor:pointer;text-decoration:none;transition:all .15s ease}
  .btn:hover{border-color:var(--slate)}
  .btn.pri{background:var(--navy);border-color:var(--navy);color:#FFF}
  .btn svg{width:14px;height:14px}

  /* report frame */
  .wrap{flex:1;min-height:0;padding:14px}
  .frame{position:relative;height:100%;background:#FFF;border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 14px rgba(28,58,94,.05);overflow:hidden}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .ld{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#FFF;color:var(--text);font-size:12px;transition:opacity .3s ease}
  .ld.hide{opacity:0;pointer-events:none}
  .spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--navy);animation:r 0.9s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}

  .ft{display:flex;justify-content:space-between;padding:0 20px 10px;font-size:10px;color:var(--muted)}

  @media (max-width:720px){
    .bar{padding:0 12px;gap:8px}.eb,.st,.btn span{display:none}.tt{font-size:15px}
    .wrap{padding:8px}.ft{padding:0 12px 8px}
  }
</style>
</head>
<body>

<header class="bar">
  <div class="tile">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9"/><path d="M10 19V5"/><path d="M16 19v-7"/><path d="M22 19H2"/></svg>
  </div>
  <div>
    <div class="eb">Project Management Information System</div>
    <div class="tt">PMIS Dashboard</div>
  </div>
  <div class="sp"></div>
  <span class="st" id="state"><i></i>Loading report</span>
  <button class="btn" id="reload" title="Reload report">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg><span>Reload</span>
  </button>
  <a class="btn" id="open" target="_blank" rel="noopener" title="Open in Power BI">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg><span>Open in Power BI</span>
  </a>
  <button class="btn pri" id="full" title="Full screen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></svg><span>Full screen</span>
  </button>
</header>

<main class="wrap">
  <div class="frame" id="frame">
    <iframe id="report" title="PMIS Power BI report" allowfullscreen></iframe>
    <div class="ld" id="loader"><div class="spin"></div>Loading Power BI report… sign in with your organisation account if asked.</div>
  </div>
</main>

<footer class="ft">
  <span>Access follows your Power BI workspace permissions.</span>
  <span id="clock"></span>
</footer>

<script>
  // ---- CONFIG -------------------------------------------------------
  // Secure embed link from Power BI: File › Embed report › Website or portal
  const REPORT_URL =
    "https://app.powerbi.com/reportEmbed?reportId=80b8d59f-4586-4224-a003-0d777c2f5eec" +
    "&appId=b608913f-ceb0-4242-bbca-0f8b1fe8ecc0&autoAuth=true&ctid=ca18acb0-3312-44f2-869d-5b01ed8bb47d";
  // Optional: hide the Power BI filter pane and page tabs inside the frame
  const EMBED_OPTIONS = "&filterPaneEnabled=false&navContentPaneEnabled=true";
  // -------------------------------------------------------------------

  const frame  = document.getElementById("report");
  const loader = document.getElementById("loader");
  const state  = document.getElementById("state");
  const src    = REPORT_URL + EMBED_OPTIONS;

  function load(){
    loader.classList.remove("hide");
    state.classList.remove("ok");
    state.lastChild.textContent = "Loading report";
    frame.src = src;
  }
  frame.addEventListener("load", () => {
    if (!frame.src) return;
    loader.classList.add("hide");
    state.classList.add("ok");
    state.lastChild.textContent = "Frame loaded";
  });

  document.getElementById("open").href = REPORT_URL;
  document.getElementById("reload").onclick = load;
  document.getElementById("full").onclick = () => {
    const el = document.getElementById("frame");
    (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  };

  const clock = document.getElementById("clock");
  const tick = () => clock.textContent = new Date().toLocaleString("en-GB",
    {day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit"});
  tick(); setInterval(tick, 30000);

  load();
</script>
</body>
</html>
