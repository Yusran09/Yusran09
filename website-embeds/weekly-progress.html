<script>
(function () {
  var root = document.getElementById('pmis-pw');
  var tt = document.getElementById('pw-tt');
  var STATUS = {
    good:     { c: 'var(--good)',     i: '✓' },
    warning:  { c: 'var(--warning)',  i: '!' },
    critical: { c: 'var(--critical)', i: '✕' }
  };
  function $(id) { return document.getElementById(id); }
  function num(v, d) { return v.toLocaleString('id-ID', { minimumFractionDigits: d, maximumFractionDigits: d }); }
  function signed(v, d) { return (v > 0 ? '+' : v < 0 ? '−' : '') + num(Math.abs(v), d); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function chip(level, text) {
    var s = el('span', 'chip'), d = el('i', 'dot');
    d.style.background = STATUS[level].c;
    s.appendChild(d);
    s.appendChild(document.createTextNode(STATUS[level].i + ' ' + text));
    return s;
  }

  /* ---------- 1. Baca bagian data ---------- */
  var cfg = { judul: 'Progress Mingguan', jenis: 'kumulatif' };
  var rows = [], problems = [];
  function parseNum(s) {
    s = (s || '').replace(/%/g, '').replace(/\s/g, '').replace(',', '.');
    if (s === '' || s === '-' || s === '–') return null;
    return /^-?\d+(\.\d+)?$/.test(s) ? parseFloat(s) : NaN;
  }
  $('pw-data').textContent.split(/\r?\n/).forEach(function (line, n) {
    var raw = line.trim();
    if (!raw || raw.charAt(0) === '#') return;
    var kv = raw.match(/^(judul|jenis)\s*:\s*(.+)$/i);
    if (kv) { cfg[kv[1].toLowerCase()] = kv[2].trim(); return; }
    var cells = raw.indexOf('\t') > -1 ? raw.split('\t') : raw.indexOf('|') > -1 ? raw.split('|') : raw.indexOf(';') > -1 ? raw.split(';') : raw.split(/\s{2,}/);
    cells = cells.map(function (c) { return c.trim(); });
    if (cells.length < 3) { problems.push('Baris “' + raw + '”: kolom kurang'); return; }
    var p = parseNum(cells[2]), a = parseNum(cells[3]);
    if (p === null || isNaN(p)) {
      if (!rows.length && isNaN(p)) return;            // baris judul kolom
      problems.push(cells[0] + ': angka Rencana “' + cells[2] + '” tidak terbaca'); return;
    }
    if (isNaN(a)) { problems.push(cells[0] + ': angka Aktual “' + cells[3] + '” tidak terbaca'); a = null; }
    rows.push({ w: cells[0], d: cells[1] || '', p: p, a: a });
  });

  var cumMode = !/^mingguan/i.test(cfg.jenis);
  // Susun nilai mingguan & kumulatif
  var data = [];
  rows.forEach(function (r, i) {
    var prev = data[i - 1];
    var o = { w: r.w, d: r.d };
    if (cumMode) {
      o.cp = r.p; o.ca = r.a;
      o.wp = prev ? r.p - prev.cp : null;
      o.wa = prev && r.a != null && prev.ca != null ? r.a - prev.ca : null;
    } else {
      o.wp = r.p; o.wa = r.a;
      o.cp = (prev ? prev.cp : 0) + r.p;
      o.ca = r.a == null || (prev && prev.ca == null) ? null : (prev ? prev.ca : 0) + r.a;
    }
    data.push(o);
  });
  var cut = -1;
  data.forEach(function (o, i) { if (o.ca != null) cut = i; });
  var lastA = null;
  data.forEach(function (o, i) {
    if (o.ca == null && i < cut) problems.push(o.w + ': Aktual kosong, padahal minggu sesudahnya sudah terisi');
    if (o.ca != null && lastA != null && o.ca < lastA) problems.push(o.w + ': Aktual kumulatif lebih kecil dari minggu sebelumnya (cek kembali)');
    if (o.ca != null) lastA = o.ca;
  });

  if (problems.length) {
    var wb = $('pw-warn');
    wb.style.display = 'block';
    wb.appendChild(chip('warning', 'Periksa bagian data:'));
    problems.slice(0, 6).forEach(function (t) { wb.appendChild(el('div', null, '• ' + t)); });
  }
  $('pw-title').textContent = cfg.judul;
  var first = cumMode ? 1 : 0;   // mode kumulatif: baris pertama = posisi awal
  if (cut < first) { $('pw-sub').textContent = 'Belum ada data aktual yang bisa dihitung.'; return; }
  var C = data[cut];
  $('pw-sub').textContent = 'Cut-off ' + C.w + (C.d ? ' · ' + C.d : '') + ' · ' + (cut + 1) + ' baris data';

  /* ---------- 2. KPI tiles ---------- */
  function ratioLevel(r) { return r >= 0.95 ? 'good' : r >= 0.85 ? 'warning' : 'critical'; }
  function devLevel(d) { return d >= -2 ? 'good' : d >= -5 ? 'warning' : 'critical'; }
  function tile(label, value, level, chipText, sub) {
    var c = el('div', 'card');
    c.appendChild(el('div', 'lbl', label));
    c.appendChild(el('div', 'val', value));
    c.appendChild(chip(level, chipText));
    c.appendChild(el('div', 'sub', sub));
    return c;
  }
  var tiles = $('pw-tiles');
  var dW = C.wa - C.wp;
  tiles.appendChild(tile('Progress minggu ini · ' + C.w, num(C.wa, 2) + '%', ratioLevel(C.wp ? C.wa / C.wp : 1),
    signed(dW, 2) + ' poin vs rencana', 'Rencana ' + num(C.wp, 2) + '%'));
  var dC = C.ca - C.cp;
  tiles.appendChild(tile('Kumulatif s.d. ' + C.w, num(C.ca, 1) + '%', devLevel(dC),
    signed(dC, 1) + ' poin vs rencana', 'Rencana ' + num(C.cp, 1) + '%'));
  var spi = C.ca / C.cp;
  tiles.appendChild(tile('SPI kumulatif', num(spi, 2), ratioLevel(spi),
    spi >= 0.95 ? 'Sesuai jadwal' : 'Terlambat', 'Aktual ÷ rencana kumulatif'));
  var k = 0, sa = 0, sp = 0;
  for (var i = cut; i >= first && k < 4; i--) { if (data[i].wa != null) { sa += data[i].wa; sp += data[i].wp; k++; } }
  tiles.appendChild(tile('Rata-rata ' + k + ' minggu terakhir', num(sa / k, 2) + '%/mgg', ratioLevel(sp ? sa / sp : 1),
    signed((sa - sp) / k, 2) + ' poin/mgg', 'Rencana ' + num(sp / k, 2) + '%/mgg'));
  $('pw-ft').textContent = 'Progress mingguan = selisih kumulatif minggu ini dan minggu sebelumnya · Status: ✓ sesuai (≥ 95% rencana), ! waspada (85–95%), ✕ kritis (< 85%). Arahkan kursor ke batang untuk detail.';

  /* ---------- 3. Tabel ---------- */
  (function () {
    var t = el('table'), th = el('thead'), tr = el('tr');
    ['Minggu', 'Tanggal', 'Rencana mgg', 'Aktual mgg', 'Rencana kum', 'Aktual kum', 'Deviasi kum'].forEach(function (h) { tr.appendChild(el('th', null, h)); });
    th.appendChild(tr); t.appendChild(th);
    var tb = el('tbody');
    data.forEach(function (o) {
      var r = el('tr');
      [o.w, o.d,
       o.wp == null ? '–' : num(o.wp, 2), o.wa == null ? '–' : num(o.wa, 2),
       num(o.cp, 1), o.ca == null ? '–' : num(o.ca, 1),
       o.ca == null ? '–' : signed(o.ca - o.cp, 1)
      ].forEach(function (v) { r.appendChild(el('td', null, v)); });
      tb.appendChild(r);
    });
    t.appendChild(tb);
    $('pw-tbl').appendChild(t);
  })();

  /* ---------- 4. Bar chart ---------- */
  var state = { mode: 'weekly', range: '12' };
  var NS = 'http://www.w3.org/2000/svg';
  function s(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var a in attrs) e.setAttribute(a, attrs[a]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function niceStep(max, count) {
    var raw = max / count, p = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10)), f = raw / p;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  }
  function barPath(x, y0, w, v, y) {
    // 4px rounded data-end, square at the baseline
    var top = y(v), h = Math.abs(top - y0), r = Math.min(4, w / 2, h);
    if (h < 0.5) return '';
    if (v >= 0) return 'M' + x + ' ' + y0 + 'V' + (top + r) + 'Q' + x + ' ' + top + ' ' + (x + r) + ' ' + top +
      'H' + (x + w - r) + 'Q' + (x + w) + ' ' + top + ' ' + (x + w) + ' ' + (top + r) + 'V' + y0 + 'Z';
    return 'M' + x + ' ' + y0 + 'V' + (top - r) + 'Q' + x + ' ' + top + ' ' + (x + r) + ' ' + top +
      'H' + (x + w - r) + 'Q' + (x + w) + ' ' + top + ' ' + (x + w) + ' ' + (top - r) + 'V' + y0 + 'Z';
  }
  function showTip(o, cx, cy) {
    tt.innerHTML = '';
    tt.appendChild(el('div', 't', o.w + (o.d ? ' · ' + o.d : '')));
    function row(color, value, label) {
      var r = el('div', 'r');
      if (color) { var k = el('i', 'lk'); k.style.background = color; r.appendChild(k); }
      r.appendChild(el('b', null, value)); r.appendChild(el('span', null, label));
      tt.appendChild(r);
    }
    var wk = state.mode === 'weekly';
    var A = wk ? o.wa : o.ca, P = wk ? o.wp : o.cp, d = wk ? 2 : 1;
    if (A != null) row('var(--s1)', num(A, d) + '%', wk ? 'Aktual minggu ini' : 'Aktual kumulatif');
    row('var(--s2)', num(P, d) + '%', wk ? 'Rencana minggu ini' : 'Rencana kumulatif');
    if (A != null) row(null, signed(A - P, d) + ' poin', 'Deviasi');
    if (wk) {
      tt.appendChild(el('div', 'sep'));
      if (o.ca != null) row(null, num(o.ca, 1) + '%', 'Aktual kumulatif');
      row(null, num(o.cp, 1) + '%', 'Rencana kumulatif');
    }
    tt.style.display = 'block';
    var rb = root.getBoundingClientRect();
    var x = cx - rb.left + 14, y = cy - rb.top + 14;
    if (x + tt.offsetWidth > rb.width - 8) x = cx - rb.left - tt.offsetWidth - 14;
    tt.style.left = Math.max(8, x) + 'px';
    tt.style.top = y + 'px';
  }
  function hideTip() { tt.style.display = 'none'; }

  var focusIdx = null;
  function draw() {
    var wk = state.mode === 'weekly';
    $('pw-ctitle').textContent = wk ? 'Progress per Minggu (%)' : 'Progress Kumulatif per Minggu (%)';
    var lo = wk ? first : 0;
    var end = state.range === 'all' ? data.length - 1 : cut;
    var start = state.range === 'all' ? lo : Math.max(lo, cut - (+state.range) + 1);
    var view = data.slice(start, end + 1);
    var box = $('pw-chart'); box.innerHTML = '';
    var W = box.clientWidth || 700, H = box.clientHeight || 280;
    var m = { t: 14, r: 8, b: 26, l: 40 };
    var iw = W - m.l - m.r, ih = H - m.t - m.b;
    var vals = [];
    view.forEach(function (o) { vals.push(wk ? o.wp : o.cp); if ((wk ? o.wa : o.ca) != null) vals.push(wk ? o.wa : o.ca); });
    var vmax = Math.max.apply(null, vals.concat([0])), vmin = Math.min.apply(null, vals.concat([0]));
    var step = niceStep((vmax - vmin) || 1, 4);
    var top = Math.ceil(vmax / step) * step || step, bot = Math.floor(vmin / step) * step;
    var y = function (v) { return m.t + (top - v) / (top - bot) * ih; };
    var y0 = y(0);
    var band = iw / view.length;
    var bw = Math.max(2, Math.min(24, (band * 0.72 - 2) / 2));
    var gw = bw * 2 + 2;

    var svg = s('svg', { viewBox: '0 0 ' + W + ' ' + H, tabindex: 0, role: 'img',
      'aria-label': 'Grafik batang ' + (wk ? 'progress mingguan' : 'progress kumulatif') + ' rencana dan aktual' }, box);
    var hl = s('rect', { y: m.t, height: ih, fill: 'var(--grid)', opacity: 0.45, visibility: 'hidden' }, svg);
    for (var v = bot; v <= top + 1e-9; v += step) {
      s('line', { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: Math.abs(v) < 1e-9 ? 'var(--axis)' : 'var(--grid)', 'stroke-width': 1 }, svg);
      var tl = s('text', { x: m.l - 6, y: y(v) + 4, 'text-anchor': 'end', 'font-size': 11, fill: 'var(--muted)' }, svg);
      tl.textContent = num(v, step < 1 ? 1 : 0) + '%';
    }
    var lstep = Math.max(1, Math.ceil(36 / band));
    var cutPos = null;
    view.forEach(function (o, i) {
      var gx = m.l + i * band + (band - gw) / 2;
      var A = wk ? o.wa : o.ca, P = wk ? o.wp : o.cp;
      if (A != null) { var pa = barPath(gx, y0, bw, A, y); if (pa) s('path', { d: pa, fill: 'var(--s1)' }, svg); }
      var pp = barPath(gx + bw + 2, y0, bw, P, y); if (pp) s('path', { d: pp, fill: 'var(--s2)' }, svg);
      if ((view.length - 1 - i) % lstep === 0) {
        var xl = s('text', { x: m.l + i * band + band / 2, y: H - 8, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--muted)' }, svg);
        xl.textContent = o.w;
      }
      if (start + i === cut && i < view.length - 1) cutPos = m.l + (i + 1) * band;
    });
    if (cutPos != null) {
      s('line', { x1: cutPos, x2: cutPos, y1: m.t, y2: m.t + ih, stroke: 'var(--ink2)', 'stroke-width': 1 }, svg);
      var ct = s('text', { x: cutPos + 4, y: m.t + 10, 'font-size': 11, fill: 'var(--muted)' }, svg);
      ct.textContent = 'Cut-off';
    }
    // hover / focus layer: whole week band is the hit target
    function pick(i, cx, cy) {
      focusIdx = i;
      hl.setAttribute('x', m.l + i * band); hl.setAttribute('width', band); hl.setAttribute('visibility', 'visible');
      showTip(view[i], cx, cy);
    }
    function clear() { hl.setAttribute('visibility', 'hidden'); hideTip(); }
    var hit = s('rect', { x: m.l, y: m.t, width: iw, height: ih, fill: 'transparent' }, svg);
    hit.addEventListener('pointermove', function (e) {
      var r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width;
      pick(Math.max(0, Math.min(view.length - 1, Math.floor((px - m.l) / band))), e.clientX, e.clientY);
    });
    hit.addEventListener('pointerleave', clear);
    function kb(i) {
      var r = svg.getBoundingClientRect();
      pick(i, r.left + (m.l + (i + 0.5) * band) * r.width / W, r.top + m.t * r.height / H);
    }
    var ci = Math.max(0, Math.min(view.length - 1, cut - start));
    svg.addEventListener('focus', function () { kb(focusIdx == null || focusIdx >= view.length ? ci : focusIdx); });
    svg.addEventListener('blur', clear);
    svg.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      var i = (focusIdx == null ? ci : focusIdx) + (e.key === 'ArrowRight' ? 1 : -1);
      kb(Math.max(0, Math.min(view.length - 1, i))); e.preventDefault();
    });
  }

  function seg(id, key) {
    var g = $(id);
    Array.prototype.forEach.call(g.querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () {
        state[key] = b.getAttribute('data-v');
        Array.prototype.forEach.call(g.querySelectorAll('button'), function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
        focusIdx = null; draw();
      });
    });
  }
  seg('pw-mode', 'mode');
  seg('pw-range', 'range');
  $('pw-tbtn').addEventListener('click', function () {
    var on = root.classList.toggle('show-table');
    this.textContent = on ? 'Grafik' : 'Tabel';
    if (!on) draw();
  });

  draw();
  var last = '';
  function onResize() { var b = $('pw-chart'), k = b.clientWidth + 'x' + b.clientHeight; if (b.clientWidth && k !== last) { last = k; draw(); } }
  if (window.ResizeObserver) new ResizeObserver(onResize).observe($('pw-chart'));
  else window.addEventListener('resize', onResize);
})();
</script>
