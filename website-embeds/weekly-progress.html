<script>
(function () {
  var root = document.getElementById('pmis-pw');
  var tt = document.getElementById('pw-tt');
  var NS = 'http://www.w3.org/2000/svg';
  var STATUS = {
    good:     { c: 'var(--good)',     i: '✓', t: 'Sesuai' },
    warning:  { c: 'var(--warning)',  i: '!', t: 'Waspada' },
    critical: { c: 'var(--critical)', i: '✕', t: 'Kritis' }
  };
  var RANK = { good: 0, warning: 1, critical: 2 };
  function $(id) { return document.getElementById(id); }
  function num(v, d) { return v.toLocaleString('id-ID', { minimumFractionDigits: d, maximumFractionDigits: d }); }
  function signed(v, d) { return (v > 0 ? '+' : v < 0 ? '−' : '') + num(Math.abs(v), d); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function s(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var a in attrs) e.setAttribute(a, attrs[a]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function dot(level) { var d = el('i', 'dot'); d.style.background = STATUS[level].c; return d; }
  function chip(level, text) {
    var c = el('span', 'chip');
    c.appendChild(dot(level));
    c.appendChild(document.createTextNode(STATUS[level].i + ' ' + text));
    return c;
  }
  // rich text: ['biasa ', ['tebal'], ' biasa']
  function rich(parent, parts) {
    parts.forEach(function (p) { parent.appendChild(Array.isArray(p) ? el('b', null, p[0]) : document.createTextNode(p)); });
    return parent;
  }
  var ICON = {
    week:  'M3 5h10M3 5v8h10V5M3 5V3h10v2M6 1.5v3M10 1.5v3M5.5 9.5h2',
    stack: 'M8 2 2 5l6 3 6-3-6-3ZM2 8l6 3 6-3M2 11l6 3 6-3',
    gauge: 'M2.5 11a5.5 5.5 0 1 1 11 0M8 11l3-3.5',
    target:'M8 14.5A6.5 6.5 0 1 0 8 1.5a6.5 6.5 0 0 0 0 13ZM8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM8 8h.01'
  };
  function icon(name) {
    var sv = s('svg', { width: 16, height: 16, viewBox: '0 0 16 16', fill: 'none', stroke: 'currentColor', 'stroke-width': 1.6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true' });
    s('path', { d: ICON[name] }, sv);
    return sv;
  }

  /* ---------- 1. Baca bagian data ---------- */
  var cfg = { judul: 'Progress Mingguan', jenis: 'kumulatif', kejar: '8' }, notes = [];
  var rows = [], problems = [];
  function parseNum(v) {
    v = (v || '').replace(/%/g, '').replace(/\s/g, '').replace(',', '.');
    if (v === '' || v === '-' || v === '–') return null;
    return /^-?\d+(\.\d+)?$/.test(v) ? parseFloat(v) : NaN;
  }
  $('pw-data').textContent.split(/\r?\n/).forEach(function (line) {
    var raw = line.trim();
    if (!raw || raw.charAt(0) === '#') return;
    var kv = raw.match(/^(judul|jenis|kejar|catatan)\s*:\s*(.+)$/i);
    if (kv) {
      var key = kv[1].toLowerCase();
      if (key === 'catatan') notes.push(kv[2].trim()); else cfg[key] = kv[2].trim();
      return;
    }
    var cells = raw.indexOf('\t') > -1 ? raw.split('\t') : raw.indexOf('|') > -1 ? raw.split('|') : raw.indexOf(';') > -1 ? raw.split(';') : raw.split(/\s{2,}/);
    cells = cells.map(function (c) { return c.trim(); });
    if (cells.length < 3) { problems.push('Baris “' + raw + '”: kolom kurang'); return; }
    var p = parseNum(cells[2]), a = parseNum(cells[3]);
    if (p === null || isNaN(p)) {
      if (!rows.length && isNaN(p)) return;            // baris judul kolom
      problems.push(cells[0] + ': angka Rencana “' + cells[2] + '” tidak terbaca'); return;
    }
    if (isNaN(a)) { problems.push(cells[0] + ': angka Aktual “' + cells[3] + '” tidak terbaca'); a = null; }
    rows.push({ w: cells[0], d: cells[1] || '', p: p, a: a });
  });

  var cumMode = !/^mingguan/i.test(cfg.jenis);
  var data = [];
  rows.forEach(function (r, i) {
    var prev = data[i - 1], o = { w: r.w, d: r.d };
    if (cumMode) {
      o.cp = r.p; o.ca = r.a;
      o.wp = prev ? r.p - prev.cp : null;
      o.wa = prev && r.a != null && prev.ca != null ? r.a - prev.ca : null;
    } else {
      o.wp = r.p; o.wa = r.a;
      o.cp = (prev ? prev.cp : 0) + r.p;
      o.ca = r.a == null || (prev && prev.ca == null) ? null : (prev ? prev.ca : 0) + r.a;
    }
    data.push(o);
  });
  var cut = -1;
  data.forEach(function (o, i) { if (o.ca != null) cut = i; });
  var lastA = null;
  data.forEach(function (o, i) {
    if (o.ca == null && i < cut) problems.push(o.w + ': Aktual kosong, padahal minggu sesudahnya sudah terisi');
    if (o.ca != null && lastA != null && o.ca < lastA) problems.push(o.w + ': Aktual kumulatif lebih kecil dari minggu sebelumnya (cek kembali)');
    if (o.ca != null) lastA = o.ca;
  });
  if (problems.length) {
    var wb = $('pw-warn');
    wb.style.display = 'block';
    wb.appendChild(el('b', null, '⚠ Periksa bagian data (Edit kode → tabel di bagian atas):'));
    problems.slice(0, 6).forEach(function (t) { wb.appendChild(el('div', null, '• ' + t)); });
  }
  $('pw-title').textContent = cfg.judul;
  var first = cumMode ? 1 : 0;   // mode kumulatif: baris pertama = posisi awal
  if (cut < first) { $('pw-sub').textContent = 'Belum ada data aktual yang bisa dihitung.'; $('pw-insight').style.display = 'none'; return; }

  /* ---------- 2. Hitungan KPI ---------- */
  var C = data[cut], P = data[cut - 1];
  function ratioLevel(r) { return r >= 0.95 ? 'good' : r >= 0.85 ? 'warning' : 'critical'; }
  function devLevel(d) { return d >= -2 ? 'good' : d >= -5 ? 'warning' : 'critical'; }
  var wRatio = C.wp ? C.wa / C.wp : 1;
  var dev = C.ca - C.cp, devPrev = P && P.ca != null ? P.ca - P.cp : null;
  var spi = C.ca / C.cp;
  var k = 0, sa = 0, sp = 0;
  for (var i = cut; i >= first && k < 4; i--) { if (data[i].wa != null) { sa += data[i].wa; sp += data[i].wp; k++; } }
  var avgA = k ? sa / k : 0, avgP = k ? sp / k : 0;
  var K = Math.max(1, parseInt(cfg.kejar, 10) || 8);
  var tIdx = Math.min(cut + K, data.length - 1), ahead = tIdx - cut;
  var need = ahead > 0 ? (data[tIdx].cp - C.ca) / ahead : null;
  var needRatio = need != null && avgA > 0 ? need / avgA : null;
  var needLevel = needRatio == null ? 'warning' : needRatio <= 1.1 ? 'good' : needRatio <= 1.3 ? 'warning' : 'critical';
  var overall = [ratioLevel(spi), devLevel(dev)].sort(function (a, b) { return RANK[b] - RANK[a]; })[0];

  $('pw-sub').textContent = 'Cut-off ' + C.w + (C.d ? ' · ' + C.d : '');
  var pill = el('div', 'pill');
  pill.appendChild(dot(overall));
  pill.appendChild(document.createTextNode(STATUS[overall].i + ' Status jadwal: ' + STATUS[overall].t + ' '));
  pill.appendChild(el('small', null, '· SPI ' + num(spi, 2)));
  $('pw-status').appendChild(pill);

  /* ---------- 3. Ringkasan otomatis ---------- */
  var ins = $('pw-ins');
  function insight(level, parts) {
    var row = el('div', 'ins');
    var ic = el('span', 'ico', STATUS[level].i);
    ic.style.background = STATUS[level].c;
    if (level === 'good' || level === 'critical') ic.style.color = '#fff';
    row.appendChild(ic);
    row.appendChild(rich(el('span', 'txt'), parts));
    ins.appendChild(row);
  }
  insight(ratioLevel(wRatio), ['Progress minggu ini ', [num(C.wa, 2) + '%'], ' vs rencana ' + num(C.wp, 2) + '% (' + num(wRatio * 100, 0) + '% dari rencana).']);
  var trend = devPrev == null ? '' : Math.abs(dev - devPrev) < 0.05 ? ', sama seperti minggu lalu' :
    (Math.abs(dev) > Math.abs(devPrev) ? ', melebar ' : ', menyempit ') + num(Math.abs(dev - devPrev), 1) + ' poin dari minggu lalu';
  insight(devLevel(dev), ['Kumulatif ', [num(C.ca, 1) + '%'], ' vs rencana ' + num(C.cp, 1) + '% — deviasi ', [signed(dev, 1) + ' poin'], trend + '.']);
  if (need != null && dev < 0) {
    insight(needLevel, ['Untuk kembali sesuai rencana dalam ' + ahead + ' minggu (s.d. ' + data[tIdx].w + '), dibutuhkan ', [num(need, 2) + '%/minggu'],
      needRatio ? ' — ' + num(needRatio, 1) + '× rata-rata ' + k + ' minggu terakhir (' + num(avgA, 2) + '%/minggu).' : '.']);
  } else if (dev >= 0) {
    insight('good', ['Progress kumulatif sudah ', ['sesuai atau di depan rencana'], '. Pertahankan laju ' + num(avgA, 2) + '%/minggu.']);
  }
  if (notes.length) notes.forEach(function (n) { $('pw-notelist').appendChild(el('li', null, n)); });
  else { $('pw-notes').style.display = 'none'; $('pw-cols').style.gridTemplateColumns = '1fr'; }

  /* ---------- 4. KPI tiles ---------- */
  function sparkline(values, ref) {
    var box = el('div', 'spark'), W = 200, H = 34, pad = 4;
    var vv = values.filter(function (v) { return v != null; });
    if (vv.length < 2) return box;
    var lo = Math.min.apply(null, vv), hi = Math.max.apply(null, vv);
    if (hi - lo < 1e-9) { hi += 1; lo -= 1; }
    if (ref != null && (ref < lo || ref > hi)) ref = null;
    var x = function (i) { return pad + i * (W - pad * 2) / (values.length - 1); };
    var y = function (v) { return pad + (hi - v) / (hi - lo) * (H - pad * 2); };
    var sv = s('svg', { viewBox: '0 0 ' + W + ' ' + H, preserveAspectRatio: 'none', 'aria-hidden': 'true' }, box);
    if (ref != null) s('line', { x1: 0, x2: W, y1: y(ref), y2: y(ref), stroke: 'var(--grid)', 'stroke-width': 1, 'vector-effect': 'non-scaling-stroke' }, sv);
    var d = values.map(function (v, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1); }).join(' ');
    s('path', { d: d, fill: 'none', stroke: 'var(--spark)', 'stroke-width': 1.75, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', 'vector-effect': 'non-scaling-stroke' }, sv);
    var li = values.length - 1;
    var dt = el('i'); // HTML dot keeps its round shape when the svg stretches
    dt.style.cssText = 'position:absolute;width:8px;height:8px;border-radius:50%;background:var(--s1);box-shadow:0 0 0 2px var(--surface);left:calc(' + (x(li) / W * 100) + '% - 4px);top:' + (y(values[li]) - 4) + 'px';
    box.style.position = 'relative';
    box.appendChild(dt);
    return box;
  }
  function tile(opt, idx) {
    var c = el('div', 'card tile anim-in');
    c.style.animationDelay = (0.05 + idx * 0.05) + 's';
    var th = el('div', 'th'), ic = el('span', 'ic');
    ic.appendChild(icon(opt.icon));
    th.appendChild(ic); th.appendChild(el('span', null, opt.label));
    if (opt.tag) th.appendChild(el('span', 'tag', opt.tag));
    c.appendChild(th);
    var v = el('div', 'val', opt.value);
    if (opt.unit) v.appendChild(el('small', null, opt.unit));
    c.appendChild(v);
    c.appendChild(chip(opt.level, opt.chip));
    if (opt.extra) c.appendChild(opt.extra);
    c.appendChild(el('div', 'sub', opt.sub));
    return c;
  }
  var last12 = data.slice(Math.max(first, cut - 11), cut + 1);
  var meter = el('div', 'meter'), mf = el('div', 'fill'), mt = el('div', 'tick');
  mf.style.width = Math.min(100, C.ca) + '%'; mt.style.left = Math.min(100, C.cp) + '%';
  meter.appendChild(mf); meter.appendChild(mt);
  var tiles = $('pw-tiles');
  [
    { icon: 'week', label: 'Progress minggu ini', tag: C.w, value: num(C.wa, 2), unit: '%', level: ratioLevel(wRatio),
      chip: signed(C.wa - C.wp, 2) + ' poin vs rencana', sub: 'Rencana ' + num(C.wp, 2) + '% · tren 12 minggu',
      extra: sparkline(last12.map(function (o) { return o.wa; })) },
    { icon: 'stack', label: 'Kumulatif', tag: 's.d. ' + C.w, value: num(C.ca, 1), unit: '%', level: devLevel(dev),
      chip: signed(dev, 1) + ' poin vs rencana', sub: 'Rencana ' + num(C.cp, 1) + '% (garis oranye)', extra: meter },
    { icon: 'gauge', label: 'SPI kumulatif', value: num(spi, 2), level: ratioLevel(spi),
      chip: spi >= 0.95 ? 'Sesuai jadwal' : 'Di bawah target 0,95', sub: 'Tren SPI 12 minggu terakhir',
      extra: sparkline(last12.map(function (o) { return o.ca / o.cp; }), 1) },
    need != null && dev < 0 ?
      { icon: 'target', label: 'Laju untuk kejar rencana', tag: ahead + ' mgg', value: num(need, 2), unit: '%/mgg', level: needLevel,
        chip: needRatio ? num(needRatio, 1) + '× laju saat ini' : 'Target s.d. ' + data[tIdx].w,
        sub: 'Rata-rata ' + k + ' mgg terakhir ' + num(avgA, 2) + '%/mgg' } :
      { icon: 'target', label: 'Rata-rata ' + k + ' minggu', value: num(avgA, 2), unit: '%/mgg', level: ratioLevel(avgP ? avgA / avgP : 1),
        chip: signed(avgA - avgP, 2) + ' poin/mgg', sub: 'Rencana ' + num(avgP, 2) + '%/mgg' }
  ].forEach(function (o, j) { tiles.appendChild(tile(o, j)); });

  var ft = $('pw-ft');
  ['good', 'warning', 'critical'].forEach(function (l) {
    var sp = el('span'); sp.appendChild(dot(l));
    sp.appendChild(document.createTextNode(STATUS[l].i + ' ' + STATUS[l].t + (l === 'good' ? ' (≥ 95% rencana)' : l === 'warning' ? ' (85–95%)' : ' (< 85%)')));
    ft.appendChild(sp);
  });
  ft.appendChild(el('span', null, 'Progress mingguan = selisih kumulatif minggu ini dan minggu sebelumnya'));

  /* ---------- 5. Tabel ---------- */
  (function () {
    var t = el('table'), th = el('thead'), tr = el('tr');
    ['Minggu', 'Tanggal', 'Rencana mgg', 'Aktual mgg', 'Rencana kum', 'Aktual kum', 'Deviasi kum'].forEach(function (h) { tr.appendChild(el('th', null, h)); });
    th.appendChild(tr); t.appendChild(th);
    var tb = el('tbody');
    data.forEach(function (o, i) {
      var r = el('tr', i === cut ? 'now' : o.ca == null ? 'fut' : '');
      [o.w, o.d,
       o.wp == null ? '–' : num(o.wp, 2), o.wa == null ? '–' : num(o.wa, 2),
       num(o.cp, 1), o.ca == null ? '–' : num(o.ca, 1)
      ].forEach(function (v) { r.appendChild(el('td', null, v)); });
      var td = el('td');
      if (o.ca != null) { var l = devLevel(o.ca - o.cp); td.appendChild(dot(l)); td.appendChild(document.createTextNode(STATUS[l].i + ' ' + signed(o.ca - o.cp, 1))); }
      else td.textContent = '–';
      r.appendChild(td);
      tb.appendChild(r);
    });
    t.appendChild(tb);
    $('pw-tbl').appendChild(t);
  })();

  /* ---------- 6. Bar chart ---------- */
  var state = { mode: 'weekly', range: '12' };
  function niceStep(max, count) {
    var raw = max / count, p = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10)), f = raw / p;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  }
  function barPath(x, y0, w, v, y) {
    // 4px rounded data-end, square at the baseline
    var top = y(v), h = Math.abs(top - y0), r = Math.min(4, w / 2, h);
    if (h < 0.5) return '';
    if (v >= 0) return 'M' + x + ' ' + y0 + 'V' + (top + r) + 'Q' + x + ' ' + top + ' ' + (x + r) + ' ' + top +
      'H' + (x + w - r) + 'Q' + (x + w) + ' ' + top + ' ' + (x + w) + ' ' + (top + r) + 'V' + y0 + 'Z';
    return 'M' + x + ' ' + y0 + 'V' + (top - r) + 'Q' + x + ' ' + top + ' ' + (x + r) + ' ' + top +
      'H' + (x + w - r) + 'Q' + (x + w) + ' ' + top + ' ' + (x + w) + ' ' + (top - r) + 'V' + y0 + 'Z';
  }
  function showTip(o, idx, cx, cy) {
    tt.innerHTML = '';
    var t = el('div', 't'); t.appendChild(document.createTextNode(o.w)); t.appendChild(el('span', null, o.d));
    tt.appendChild(t);
    function row(color, value, label) {
      var r = el('div', 'r');
      var kk = el('i', 'lk'); kk.style.background = color || 'transparent'; r.appendChild(kk);
      r.appendChild(el('b', null, value)); r.appendChild(el('span', null, label));
      tt.appendChild(r);
    }
    var wk = state.mode === 'weekly';
    var A = wk ? o.wa : o.ca, Pv = wk ? o.wp : o.cp, d = wk ? 2 : 1;
    if (A != null) row('var(--s1)', num(A, d) + '%', 'Aktual');
    row('var(--s2)', num(Pv, d) + '%', idx > cut ? 'Rencana (mendatang)' : 'Rencana');
    if (A != null) row(null, signed(A - Pv, d), 'poin deviasi');
    if (wk) {
      tt.appendChild(el('div', 'sep'));
      if (o.ca != null) row(null, num(o.ca, 1) + '%', 'Aktual kumulatif');
      row(null, num(o.cp, 1) + '%', 'Rencana kumulatif');
    }
    if (A != null && Pv) {
      var lv = wk ? ratioLevel(A / Pv) : devLevel(A - Pv);
      tt.appendChild(chip(lv, wk ? num(A / Pv * 100, 0) + '% dari rencana' : STATUS[lv].t));
    }
    tt.style.display = 'block';
    var rb = root.getBoundingClientRect();
    var x = cx - rb.left + 16, y = cy - rb.top + 16;
    if (x + tt.offsetWidth > rb.width - 8) x = cx - rb.left - tt.offsetWidth - 16;
    if (y + tt.offsetHeight > rb.height - 8) y = cy - rb.top - tt.offsetHeight - 16;
    tt.style.left = Math.max(8, x) + 'px';
    tt.style.top = Math.max(8, y) + 'px';
  }
  function hideTip() { tt.style.display = 'none'; }

  var focusIdx = null;
  function legend(showFuture) {
    var lg = $('pw-legend'); lg.innerHTML = '';
    function item(color, text, op) {
      var sp = el('span'), sw = el('i', 'lr'); sw.style.background = color; if (op) sw.style.opacity = op;
      sp.appendChild(sw); sp.appendChild(document.createTextNode(text)); lg.appendChild(sp);
    }
    item('var(--s1)', 'Aktual'); item('var(--s2)', 'Rencana');
    if (showFuture) item('var(--s2)', 'Rencana minggu mendatang', 0.45);
    var nw = el('span'), sw = el('i', 'lr'); sw.style.cssText = 'background:var(--now);border:1px solid rgba(42,120,214,.35);border-radius:3px';
    nw.appendChild(sw); nw.appendChild(document.createTextNode('Minggu ini (' + C.w + ')')); lg.appendChild(nw);
  }
  function draw(animate) {
    var wk = state.mode === 'weekly';
    $('pw-ctitle').textContent = wk ? 'Progress per Minggu' : 'Progress Kumulatif per Minggu';
    $('pw-ccap').textContent = wk ? 'Rencana vs aktual yang dicapai setiap minggu (%)' : 'Posisi progress kumulatif di akhir setiap minggu (%)';
    var lo = wk ? first : 0;
    var end = state.range === 'all' ? data.length - 1 : cut;
    var start = state.range === 'all' ? lo : Math.max(lo, cut - (+state.range) + 1);
    var view = data.slice(start, end + 1);
    legend(end > cut);
    var box = $('pw-chart'); box.innerHTML = '';
    var W = box.clientWidth || 700, H = box.clientHeight || 300;
    lastSize = box.clientWidth + 'x' + box.clientHeight;
    var m = { t: 22, r: 8, b: 26, l: 42 };
    var iw = W - m.l - m.r, ih = H - m.t - m.b;
    var vals = [];
    view.forEach(function (o) { vals.push(wk ? o.wp : o.cp); if ((wk ? o.wa : o.ca) != null) vals.push(wk ? o.wa : o.ca); });
    var vmax = Math.max.apply(null, vals.concat([0])), vmin = Math.min.apply(null, vals.concat([0]));
    var step = niceStep((vmax - vmin) || 1, 4);
    var top = Math.ceil(vmax / step) * step || step, bot = Math.floor(vmin / step) * step;
    var y = function (v) { return m.t + (top - v) / (top - bot) * ih; };
    var y0 = y(0);
    var band = iw / view.length;
    var bw = Math.max(2, Math.min(24, (band * 0.72 - 2) / 2));
    var gw = bw * 2 + 2;

    var svg = s('svg', { viewBox: '0 0 ' + W + ' ' + H, tabindex: 0, role: 'img', 'class': animate ? 'anim' : '',
      'aria-label': 'Grafik batang ' + (wk ? 'progress mingguan' : 'progress kumulatif') + ' rencana dan aktual. Gunakan panah kiri/kanan untuk melihat nilai.' }, box);
    // current-week band
    var ci = cut - start;
    if (ci >= 0 && ci < view.length) {
      s('rect', { x: m.l + ci * band + 1, y: m.t - 18, width: band - 2, height: ih + 18, rx: 6, fill: 'var(--now)' }, svg);
      var nl = s('text', { x: m.l + ci * band + band / 2, y: m.t - 6, 'text-anchor': band < 40 ? 'end' : 'middle', 'font-size': 10.5, 'font-weight': 600, fill: 'var(--s1)' }, svg);
      if (band < 40) nl.setAttribute('x', m.l + (ci + 1) * band - 2);
      nl.textContent = 'Minggu ini';
    }
    for (var v = bot; v <= top + 1e-9; v += step) {
      s('line', { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: Math.abs(v) < 1e-9 ? 'var(--axis)' : 'var(--grid)', 'stroke-width': 1 }, svg);
      var tl = s('text', { x: m.l - 8, y: y(v) + 4, 'text-anchor': 'end', 'font-size': 11, fill: 'var(--muted)' }, svg);
      tl.textContent = num(v, step < 1 ? 1 : 0) + '%';
    }
    var lstep = Math.max(1, Math.ceil(38 / band));
    var groups = [];
    view.forEach(function (o, i) {
      var g = s('g', { 'class': 'grp' + (start + i > cut ? ' future' : '') }, svg);
      groups.push(g);
      var gx = m.l + i * band + (band - gw) / 2;
      var A = wk ? o.wa : o.ca, Pv = wk ? o.wp : o.cp;
      var delay = Math.min(i * 18, 450) + 'ms';
      if (A != null) { var pa = barPath(gx, y0, bw, A, y); if (pa) s('path', { d: pa, fill: 'var(--s1)', 'class': 'bar' + (A < 0 ? ' neg' : ''), style: 'animation-delay:' + delay }, g); }
      var pp = barPath(gx + bw + 2, y0, bw, Pv, y); if (pp) s('path', { d: pp, fill: 'var(--s2)', 'class': 'bar' + (Pv < 0 ? ' neg' : ''), style: 'animation-delay:' + delay }, g);
      if ((view.length - 1 - i) % lstep === 0) {
        var xl = s('text', { x: m.l + i * band + band / 2, y: H - 8, 'text-anchor': 'middle', 'font-size': 11, fill: start + i === cut ? 'var(--ink)' : 'var(--muted)', 'font-weight': start + i === cut ? 600 : 400 }, svg);
        xl.textContent = o.w;
      }
    });
    function pick(i, cx, cy) {
      focusIdx = i;
      svg.classList.add('hovering');
      groups.forEach(function (g, j) { g.classList.toggle('on', j === i); });
      showTip(view[i], start + i, cx, cy);
    }
    function clear() { svg.classList.remove('hovering'); hideTip(); }
    var hit = s('rect', { x: m.l, y: m.t - 18, width: iw, height: ih + 18, fill: 'transparent' }, svg);
    hit.addEventListener('pointermove', function (e) {
      var r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width;
      pick(Math.max(0, Math.min(view.length - 1, Math.floor((px - m.l) / band))), e.clientX, e.clientY);
    });
    hit.addEventListener('pointerleave', clear);
    function kb(i) {
      var r = svg.getBoundingClientRect();
      pick(i, r.left + (m.l + (i + 0.5) * band) * r.width / W, r.top + m.t * r.height / H);
    }
    var cIdx = Math.max(0, Math.min(view.length - 1, ci));
    svg.addEventListener('focus', function () { kb(focusIdx == null || focusIdx >= view.length ? cIdx : focusIdx); });
    svg.addEventListener('blur', clear);
    svg.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      var n = (focusIdx == null ? cIdx : focusIdx) + (e.key === 'ArrowRight' ? 1 : -1);
      kb(Math.max(0, Math.min(view.length - 1, n))); e.preventDefault();
    });
  }

  function seg(id, key) {
    var g = $(id);
    Array.prototype.forEach.call(g.querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () {
        state[key] = b.getAttribute('data-v');
        Array.prototype.forEach.call(g.querySelectorAll('button'), function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
        focusIdx = null; draw(true);
      });
    });
  }
  seg('pw-mode', 'mode');
  seg('pw-range', 'range');
  $('pw-tbtn').addEventListener('click', function () {
    var on = root.classList.toggle('show-table');
    this.textContent = on ? 'Grafik' : 'Tabel';
    if (!on) draw(true);
  });

  var lastSize = '';
  draw(true);
  function onResize() {
    var b = $('pw-chart');
    if (b.clientWidth && b.clientWidth + 'x' + b.clientHeight !== lastSize) draw(false);
  }
  if (window.ResizeObserver) new ResizeObserver(onResize).observe($('pw-chart'));
  else window.addEventListener('resize', onResize);
})();
</script>
