<template id="pmhub-d1"><!-- =====================================================================
  ✏️  PENGATURAN — Dashboard Logistics Readiness (Final Packing List → Site)
  Judul        : judul dashboard (tampil di halaman Overview).
  Sheet ID     : ID Google Sheet (teks di antara /d/ dan /edit pada link Bagikan). Kosong = hanya data cadangan di bawah.
                 Akses umum sheet = "Siapa saja yang memiliki link: Pelihat" (JANGAN Editor — ID ini terlihat di kode halaman).
  Sumber       : (cadangan) link "Publish to web" seluruh dokumen (…/pub?output=csv). Boleh dibiarkan kosong.
  Tab Package  : nama tab Summary Packing List (1 baris = 1 package).           Default: Packages
  Tab Detail   : nama tab Detail Packing List (1 baris = 1 blok detail).        Default: Detail
  Tab Item     : nama tab baris material (1 baris = 1 item).                    Default: Items
  Tab Issue    : nama tab exception register dari ETL.                          Default: Issues
                 Isi keempat tab = file LOGISTICS-PMIS-SHEET.xlsx dari builder (format teks, judul kolom di baris 1).
  Data Date    : tanggal status data (contoh 5 Nov 2026). Kosong = kolom "Data Date" di tab Packages.
  Bobot Gate   : bobot Readiness Index: Packing List / MDR / Site / Inspection (jumlah 100). Default 15 / 35 / 15 / 35.
  Kredit RES   : kredit MDR berstatus Resubmit (0–1). Default 0.5. Approved / tidak perlu MDR = 1.
  MDR Tidak Perlu : kata di Remark / MDR No. yang berarti MDR tidak diperlukan (pisahkan dengan koma).
  Lokasi       : kata di Remark / catatan site yang berarti barang sudah di lokasi (laydown, camp, warehouse, …).
  Tag Site     : kata di catatan site yang berarti barang sudah tiba (onsite, arrived, …).
  Batas MDR    : hari setelah inspeksi sebelum "MDR pending" menjadi kuning / merah. Default 7 / 14.
  Basis        : package | tonase — satuan awal grafik & tabel (bisa diganti dengan tombol di dashboard).
  Cek Data     : tampil | sembunyi — tanda "Data check" + panel "Readiness checks" (sembunyikan untuk publik).
  Auto Refresh : menit antar pembaruan otomatis dari Google Sheet (120 = setiap 2 jam, 0 = mati).
  Tema         : terang | gelap | auto      Kepekatan : 0–100 (default 62)
  Skala        : lebar | penuh               Latar     : auto | transparan | abyss | tide | reef | dusk | kabut | pasir
  Batas Umur Data : hari setelah data date sebelum data ditandai "lama" (default 10).
  Gambar Latar : link foto (https://…) untuk halaman Welcome. Welcome : tampil | sembunyi
  Aturan Ready : Packing list terverifikasi + MDR Approved (atau tidak perlu) + diterima & diinspeksi (RFS + tanggal inspeksi)
                 — sama dengan aturan ETL (config/readiness_rules.json). Bila hasil di sini berbeda dengan kolom
                 "Readiness Status (ETL)", dashboard memberi tanda di "Data check".
====================================================================== -->

Tab Issue    : Issues
Data Date    :
Bobot Gate   : 15 / 35 / 15 / 35
Kredit RES   : 0.5
MDR Tidak Perlu : mdr not required, mdr is not required, no mdr required
Lokasi       : laydown, askara, camp, warehouse, yard, store
Tag Site     : onsite, on site, on-site, arrived
Batas MDR    : 7 / 14
Basis        : package
Cek Data     : tampil
Auto Refresh : 120

Skala        : lebar

Batas Umur Data : 10
Gambar Latar : {{IMAGE}}
